<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扈鹿鹿 & 郭琳琳｜恋爱纪念</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root{
            --rose:#f472b6;
            --rose-soft:#fb7185;
            --gold:#d4af87;
            --ink:#4b2e3b;
        }
        body{
            font-family:"Noto Serif SC", serif;
            color:var(--ink);
            background:
                radial-gradient(circle at 20% 20%, #ffd6e7 0, transparent 45%),
                radial-gradient(circle at 80% 10%, #fff1f6 0, transparent 50%),
                linear-gradient(180deg,#fff7fb 0%, #ffe4f1 100%);
            background-attachment: fixed;
            overflow-x:hidden;
        }
        .title-hand{
            font-family:"Dancing Script", cursive;
        }
        .mono{
            font-family:"JetBrains Mono", monospace;
        }
        .glass{
            background: rgba(255,255,255,0.62);
            border: 1px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 30px 60px -30px rgba(244,114,182,0.45),
                0 10px 30px -15px rgba(212,175,135,0.35),
                inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .btn-primary{
            background: linear-gradient(135deg,#f472b6,#fb7185);
            box-shadow: 0 14px 30px -12px rgba(244,114,182,0.55);
            transition: all .3s ease;
        }
        .btn-primary:hover{
            transform: translateY(-2px);
            box-shadow: 0 18px 34px -12px rgba(244,114,182,0.7);
        }
        .heart{
            position:absolute;
            opacity:.55;
            animation: floatUp linear infinite;
            pointer-events:none;
            color:#f472b6;
        }
        @keyframes floatUp{
            0%{transform:translateY(20px) scale(.9);opacity:0}
            10%{opacity:.55}
            100%{transform:translateY(-120vh) scale(1.1);opacity:0}
        }
        .pulse-ring{
            position:absolute;
            inset:-14px;
            border-radius:999px;
            border:1px dashed rgba(244,114,182,0.35);
            animation: rotate 22s linear infinite;
        }
        @keyframes rotate{
            to{transform: rotate(360deg);}
        }
        .timer-number{
            background: linear-gradient(180deg,#fce7f3 0%,#fff 100%);
            border: 1px solid rgba(244,114,182,0.25);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.9),
                0 10px 24px -14px rgba(244,114,182,0.45);
        }
        .scroll-wrap{
            overflow:hidden;
        }
        .scroll-inner{
            display:flex;
            gap:14px;
            width:max-content;
            animation: scrollImg 32s linear infinite;
        }
        .scroll-inner:hover{
            animation-play-state:paused;
        }
        @keyframes scrollImg{
            0%{transform:translateX(0);}
            100%{transform:translateX(-50%);}
        }
        .photo-card{
            width:260px;
            height:170px;
            border-radius:22px;
            overflow:hidden;
            flex:none;
            position:relative;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow:
                0 20px 40px -24px rgba(244,114,182,0.45),
                0 8px 20px -18px rgba(212,175,135,0.35);
        }
        .photo-card img{
            width:100%;
            height:100%;
            object-fit:cover;
            transition: transform .6s ease;
        }
        .photo-card:hover img{
            transform: scale(1.06);
        }
        .divider{
            width:64px;
            height:1px;
            background: linear-gradient(90deg, transparent, rgba(244,114,182,0.6), transparent);
            margin:14px auto;
        }
        .label-tag{
            font-size:12px;
            letter-spacing:6px;
            color:#d4af87;
        }
        .login-card{
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.9);
            backdrop-filter: blur(14px);
            box-shadow: 0 30px 60px -30px rgba(244,114,182,0.45);
        }
        input:focus{ outline:none; }
    </style>
</head>
<body>
<div id="hearts"></div>
<div id="loginPage" class="min-h-screen flex items-center justify-center px-4 relative z-10">
    <div class="login-card rounded-3xl p-10 w-full max-w-md text-center">
        <div class="title-hand text-5xl text-rose-500 mb-2">For You</div>
        <h2 class="text-xl font-semibold text-rose-600">欢迎进入我们的小世界</h2>
        <div class="divider"></div>
        <p class="text-sm text-rose-400 mb-6">提示：密码是郭琳琳锁屏密码</p>
        <input id="pwdInput" type="password"
            class="w-full border border-rose-200 rounded-2xl px-4 py-3 bg-white/80 text-center tracking-[8px] text-lg focus:border-rose-400 focus:ring-2 focus:ring-rose-200 transition"
            placeholder="请输入密码" />
        <p id="errMsg" class="text-red-500 text-sm mt-3 h-5"></p>
        <button onclick="checkPassword()"
            class="btn-primary w-full mt-4 text-white py-3 rounded-2xl text-base font-medium">
            进入我们的纪念页
        </button>
    </div>
</div>

<div id="homePage" class="hidden min-h-screen relative z-10 pb-24">
    <header class="pt-14 pb-6 text-center">
        <div class="label-tag">OUR LOVE STORY</div>
        <h1 class="title-hand text-6xl md:text-7xl text-rose-500 mt-2">
            扈鹿鹿 & 郭琳琳
        </h1>
        <div class="divider"></div>
        <p class="text-rose-400 text-sm md:text-base">
            从 2025.11.25 22:00 开始，认真相爱每一天
        </p>
    </header>
    <main class="container mx-auto px-4 max-w-6xl">
        <section class="glass rounded-[32px] p-8 md:p-12 mt-6 relative overflow-hidden">
            <div class="pulse-ring"></div>
            <div class="text-center relative">
                <p class="label-tag">TOGETHER</p>
                <h2 class="text-2xl md:text-3xl font-semibold text-rose-600 mt-2">
                    我们在一起已经
                </h2>
                <div id="timeShow"
                    class="timer-number mono text-4xl md:text-6xl font-bold text-rose-600 mt-6 rounded-3xl py-5 px-4 md:px-8 inline-block min-w-[280px] md:min-w-[420px]">
                    0天 00:00:00
                </div>
                <div class="mt-6 flex flex-col md:flex-row items-center justify-center gap-3 text-sm text-rose-400">
                    <span class="inline-flex items-center gap-2">
                        <span class="inline-block w-2 h-2 rounded-full bg-rose-400"></span>
                        开始时间：2025-11-25 22:00
                    </span>
                    <span class="hidden md:inline text-rose-300">|</span>
                    <span id="todayInfo">今天是我们相爱旅程中的第 0 天</span>
                </div>
            </div>
        </section>
        <section class="glass rounded-[32px] p-8 md:p-10 mt-10">
            <div class="text-center">
                <p class="label-tag">MEMORY ALBUM</p>
                <h2 class="text-2xl md:text-3xl font-semibold text-rose-600 mt-2 mb-2">
                    我们的相册
                </h2>
                <p class="text-sm text-rose-400 mb-6">💡图片从网络图床加载；如需新增照片，修改网页代码内图片链接数组</p>
            </div>
            <div class="scroll-wrap mt-7 rounded-3xl">
                <div id="scrollContainer" class="scroll-inner">
                </div>
            </div>
        </section>
    </main>
    <footer class="text-center text-rose-400 text-xs mt-14">
        Made with love · For 扈鹿鹿 & 郭琳琳
    </footer>
</div>

<script>
    const correctPwd = "071123";
    const startDate = new Date("2025-11-25T22:00:00");

    // =====================在这里粘贴你的图片网络地址！！=====================
    const photoUrlList = [
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/16ee97242f26945b60c329b0d5016be7.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/2d30c981ab9072dfaa7187b485b15180.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/3931f987aefc01c74661f8e76a6f9f61.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/3993369178d0f9601189f5ab6a20689b.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/451d239f6cc13f4a3794355157ddfc26.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/46ab8842839082d230d0931366f6671f.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/676e2b7fe4ae6962ecb558df207947b7.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/76bc44820769683c6409a4387dad3d4c.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/7bc84515621cea0e360c467b93ff546c.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/b657bb0ed786e80b96f44311ecb9836d.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/c8222dba0a0ba632f69ef42cd857ed75.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/d89311fa28809eabba3279d1b8120432.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/e1c6db1290ee60a71d1832582e4d7563.jpg",
"https://cdn.jsdelivr.net/gh/maomaohu209/hululu-guolinlin@main/fd3858ec891d2a3a0fc1b2aa43e11ba5.jpg"
];
    // =====================================================================

    const loginPage = document.getElementById("loginPage");
    const homePage = document.getElementById("homePage");
    const pwdInput = document.getElementById("pwdInput");
    const errMsg = document.getElementById("errMsg");
    const timeShow = document.getElementById("timeShow");
    const todayInfo = document.getElementById("todayInfo");
    const scrollContainer = document.getElementById("scrollContainer");
    const heartsBox = document.getElementById("hearts");

    //限制爱心最大数量，防止手机卡顿！
    function createHeart(){
        if(heartsBox.children.length>8) return;
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "♥";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (14 + Math.random() * 16) + "px";
        heart.style.animationDuration = (12 + Math.random() *10) + "s";
        heartsBox.appendChild(heart);
        setTimeout(()=> heart.remove(),25000);
    }
    setInterval(createHeart,2200);

    function checkPassword(){
        if(pwdInput.value.trim() === correctPwd){
            loginPage.classList.add("hidden");
            homePage.classList.remove("hidden");
            renderAlbum();
        }else{
            errMsg.innerText = "密码错误，请重新输入";
            pwdInput.select();
        }
    }
    pwdInput.addEventListener("keydown", e=>{
        if(e.key === "Enter") checkPassword();
    });

    function pad(n){ return String(n).padStart(2,"0"); }
    function calcTime(){
        const now = new Date();
        let diffMs = now.getTime() - startDate.getTime();
        if(diffMs <0) diffMs=0;
        const totalSec = Math.floor(diffMs /1000);
        const days = Math.floor(totalSec /86400);
        const remain = totalSec %86400;
        const h = Math.floor(remain /3600);
        const m = Math.floor((remain %3600)/60);
        const s = remain %60;
        timeShow.innerText = `${days}天 ${pad(h)}:${pad(m)}:${pad(s)}`;
        todayInfo.innerText = `今天是我们相爱旅程中的第 ${days +1} 天`;
    }
    setInterval(calcTime,1000);
    calcTime();

    //渲染滚动相册，自动复制数组实现无缝滚动
    function renderAlbum(){
        const arr = [...photoUrlList,...photoUrlList];
        arr.forEach(url=>{
            const card = document.createElement("div");
            card.className="photo-card";
            const img = document.createElement("img");
            img.src = url;
            img.alt="恋爱回忆";
            img.loading="lazy";
            card.appendChild(img);
            scrollContainer.appendChild(card);
        })
    }
</script>
</body>
</html>
